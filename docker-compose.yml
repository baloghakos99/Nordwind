services:
  app:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "8080"
      DATA_DIR: /data
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
      LLM_CONCURRENCY: ${LLM_CONCURRENCY:-3}
    volumes:
      - nordwind-data:/data

volumes:
  nordwind-data:
